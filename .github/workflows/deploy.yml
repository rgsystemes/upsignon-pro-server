---
name: Deploy USO
on:
  push:
    branches:
      - unstable

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Trigger USO deploy workflow
    steps:
      - name: Trigger USO deploy workflow
        run: |
          curl --fail -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.RGSUPVDEV_TOKEN }}" \
            https://api.github.com/repos/rgsystemes/eel-ops/actions/workflows/uso.deploy.yml/dispatches \
            -d '{"ref":"master","inputs":{"repository":"${{ github.event.repository.name }}","branch":"${{ github.ref_name }}"}}'
